<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Redirecionando...</title>
  <!-- ============================================================
       Esta página não existe mais como uma página separada.
       O convite e a lista de presentes agora vivem juntos em
       index.html (assim a música não para ao trocar de seção).
       Este arquivo só existe para não quebrar links antigos que
       apontem para "presentes.html" — ele manda a pessoa direto
       para a lista de presentes dentro do index.html.
       ============================================================ -->
  <meta http-equiv="refresh" content="0; url=index.html#presentes" />
  <script>window.location.replace('index.html#presentes');</script>
</head>
<body>
  <p>Redirecionando para <a href="index.html#presentes">a lista de presentes</a>...</p>
</body>
</html>
